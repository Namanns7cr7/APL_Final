name: CI

on:
  push:
    branches:
      - '**'

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build with Vite
        run: npm run build

      - name: Run Jest tests
        run: npm test

      - name: Lint code
        run: npm run lint
